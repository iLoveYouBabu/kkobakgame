<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>꼬박게임</title>

  <link rel="stylesheet" href="./css/style.css">

  <script
    src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"
    defer
  ></script>
  <script src="./js/app.js" defer></script>
</head>

<body>
  <main class="container">
    <header class="title-area">
      <h1>꼬박게임 🍉</h1>
    </header>

    <section id="loginScreen" class="login-card">
      <label for="nickname">닉네임</label>

      <input
        id="nickname"
        type="text"
        maxlength="10"
        placeholder="닉네임을 입력하세요"
        autocomplete="nickname"
      >

      <button id="startButton" type="button">
        게임 시작
      </button>
    </section>

    <section id="gameScreen" class="game-screen hidden">
      <div class="game-layout">
        <div class="game-main">
          <div class="game-info">
            <span id="playerName"></span>

            <div class="score-group" aria-label="점수 정보">
              <span class="score-box">
                점수
                <strong id="score">0</strong>
              </span>

              <span class="score-box high-score-box">
                최고
                <strong id="highScore">0</strong>
              </span>
            </div>
          </div>

          <div class="guide-row">
            <p class="guide">
              PC는 클릭, 모바일은 드래그 후 놓아주세요.
            </p>
          </div>

          <div id="gameContainer" class="game-container">
            <div
              id="aimFruit"
              class="aim-fruit hidden"
              aria-hidden="true"
            ></div>

            <div
              id="dropGuide"
              class="drop-guide hidden"
              aria-hidden="true"
            ></div>

            <div
              id="gameOverLine"
              class="game-over-line hidden"
              aria-hidden="true"
            >
              <span>위험선</span>
            </div>
          </div>
        </div>

        <aside class="next-fruits-panel" aria-label="다음 과일 목록">
          <h2>다음 과일</h2>
          <ol id="nextFruitList" class="next-fruit-list"></ol>
        </aside>
      </div>

      <button
        id="fruitGuideButton"
        class="fruit-guide-button"
        type="button"
        aria-haspopup="dialog"
        aria-controls="fruitGuideModal"
      >
        도감
      </button>

      <div
        id="fruitGuideModal"
        class="fruit-guide-modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="fruitGuideTitle"
      >
        <div class="fruit-guide-card">
          <div class="fruit-guide-header">
            <div>
              <p class="fruit-guide-eyebrow">꼬박 합체 순서</p>
              <h2 id="fruitGuideTitle">단계 도감</h2>
            </div>

            <button
              id="closeFruitGuideButton"
              class="fruit-guide-close-button"
              type="button"
              aria-label="단계 도감 닫기"
            >
              ×
            </button>
          </div>

          <ol id="fruitGuideList" class="fruit-guide-list"></ol>
        </div>
      </div>

      <div
        id="gameOverModal"
        class="game-over-modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="gameOverTitle"
      >
        <div class="game-over-card">
          <p class="game-over-eyebrow">꼬박!</p>
          <h2 id="gameOverTitle">게임 오버</h2>

          <p
            id="newRecordMessage"
            class="new-record-message hidden"
          >
            신기록이에요! 🎉
          </p>

          <div class="final-score-grid">
            <p class="final-score-label">
              최종 점수
              <strong id="finalScore">0</strong>
            </p>

            <p class="final-score-label">
              최고 점수
              <strong id="finalHighScore">0</strong>
            </p>
          </div>

          <button id="closeGameOverButton" type="button">
            처음으로 돌아가기
          </button>
        </div>
      </div>
    </section>

    <p id="message" class="message" aria-live="polite"></p>
  </main>
</body>
</html>
