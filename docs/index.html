<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>꼬박게임</title>

  <link rel="stylesheet" href="./css/style.css">

  <script
    src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"
    defer
  ></script>
  <script src="./js/app.js" defer></script>
</head>

<body>
  <main class="container">
    <header class="title-area">
      <h1>꼬박게임 🍉</h1>
    </header>

    <section id="loginScreen" class="login-card">
      <label for="nickname">닉네임</label>

      <input
        id="nickname"
        type="text"
        maxlength="10"
        placeholder="닉네임을 입력하세요"
        autocomplete="nickname"
      >

      <button id="startButton" type="button">
        게임 시작
      </button>
    </section>

    <section id="gameScreen" class="game-screen hidden">
      <div class="game-layout">
        <div class="game-main">
          <div class="game-info">
            <span id="playerName"></span>

            <span class="score-box">
              점수
              <strong id="score">0</strong>
            </span>
          </div>

          <div class="guide-row">
            <p class="guide">
              PC는 클릭, 모바일은 드래그 후 놓아주세요.
            </p>
          </div>

          <div id="gameContainer" class="game-container">
            <div
              id="aimFruit"
              class="aim-fruit hidden"
              aria-hidden="true"
            ></div>

            <div
              id="dropGuide"
              class="drop-guide hidden"
              aria-hidden="true"
            ></div>

            <div
              id="gameOverLine"
              class="game-over-line hidden"
              aria-hidden="true"
            >
              <span>위험선</span>
            </div>
          </div>
        </div>

        <aside class="next-fruits-panel" aria-label="다음 과일 목록">
          <h2>다음 과일</h2>
          <ol id="nextFruitList" class="next-fruit-list"></ol>
        </aside>
      </div>

      <div
        id="gameOverModal"
        class="game-over-modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="gameOverTitle"
      >
        <div class="game-over-card">
          <p class="game-over-eyebrow">꼬박!</p>
          <h2 id="gameOverTitle">게임 오버</h2>

          <p class="final-score-label">
            최종 점수
            <strong id="finalScore">0</strong>
          </p>

          <button id="closeGameOverButton" type="button">
            처음으로 돌아가기
          </button>
        </div>
      </div>
    </section>

    <p id="message" class="message" aria-live="polite"></p>
  </main>
</body>
</html>
